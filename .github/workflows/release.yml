# Builds Endora Album for Windows and Mac in the cloud and publishes it as a GitHub Release.
# Installed apps see the new version and update themselves.
#
# Start it: GitHub → Actions → Release → Run workflow
#   (or push a version tag:  git tag v1.0.1 && git push origin v1.0.1)
# The version comes from package.json (or from the tag). Installers are published as a
# Release in this same repository, using GitHub's built-in token: no secrets to add.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: 'Which installers to build'
        type: choice
        options: [all, mac, windows]
        default: all

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1   # one at a time so both add files to the same release
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install
        run: npm install

      # macOS runners sometimes keep the new .dmg volume busy ("hdiutil detach" fails):
      # stop Spotlight indexing so electron-builder can unmount it.
      - name: Mac: stop Spotlight indexing
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off || true

      - name: Image engine for both Mac chips
        if: runner.os == 'macOS' && inputs.platform != 'windows'
        run: |
          OD=$(node -p "JSON.stringify(require('sharp/package.json').optionalDependencies)")
          V1=$(node -p "($OD)['@img/sharp-darwin-x64']")
          V2=$(node -p "($OD)['@img/sharp-libvips-darwin-x64']")
          npm install --no-save --force "@img/sharp-darwin-x64@$V1" "@img/sharp-libvips-darwin-x64@$V2" "@img/sharp-darwin-arm64@$V1" "@img/sharp-libvips-darwin-arm64@$V2"

      - name: Build + publish Windows
        if: runner.os == 'Windows' && inputs.platform != 'mac'
        run: npm run release:win

      - name: Build + publish Mac
        if: runner.os == 'macOS' && inputs.platform != 'windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run release:mac
